<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" stroke-linejoin="round" stroke-linecap="round">
  <!-- block with a wavy (sloped) top, like the 3D wavy test part -->
  <g transform="translate(3.4 3) scale(0.82)" stroke="#3a78c9" stroke-width="0.8">
    <path d="M1.5 8C4 4.5 6 4.5 7.5 8S11 11.5 13.5 8L18.5 4C16 7.5 14 7.5 12.5 4S9 0.5 6.5 4z" fill="#cfe2ff"/>
    <path d="M13.5 8L18.5 4V14.5L13.5 18.5z" fill="#4f9cff"/>
    <path d="M1.5 8C4 4.5 6 4.5 7.5 8S11 11.5 13.5 8V18.5H1.5z" fill="#4f9cff"/>
    <!-- deburred edges: gold, like PhysCAD's edge selection -->
    <path d="M1.5 8C4 4.5 6 4.5 7.5 8S11 11.5 13.5 8L18.5 4" fill="none" stroke="#e89a1c" stroke-width="2"/>
  </g>
  <!-- chamfer mill: shank on a wide 90-degree cone, its point on the edge -->
  <g stroke="#5f6670" stroke-width="0.7" fill="#c3c9d1">
    <path d="M5.3 0.5H9.5V5.2H5.3z"/>
    <path d="M5.3 5.2H9.5L7.4 7.4z"/>
    <path d="M5.3 5.2H7.4V7.4z" fill="#8f97a1" stroke="none"/>
    <path d="M7.4 0.5V7.4" fill="none" stroke-width="0.5"/>
  </g>
</svg>
